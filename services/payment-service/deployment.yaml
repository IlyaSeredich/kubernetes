apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  selector:
    matchLabels:
      app: payment-service
  replicas: 2
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ilya1626/innowise-payment-service
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secret

