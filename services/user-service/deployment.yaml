apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  replicas: 2
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ilya1626/innowise-user-service
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-secret

