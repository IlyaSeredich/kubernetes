apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  selector:
    matchLabels:
      app: order-service
  replicas: 2
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ilya1626/innowise-order-service
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret

