apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  replicas: 2
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ilya1626/innowise-auth-service
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret

