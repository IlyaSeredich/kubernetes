apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  selector:
    matchLabels:
      app: gateway-service
  replicas: 2
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ilya1626/innowise-gateway-service
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: gateway-config


